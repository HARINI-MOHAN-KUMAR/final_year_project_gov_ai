version: '3.8'

services:
  govguide-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govguide-ai-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=GovGuide AI
      - APP_ENV=production
      - DEBUG=false
      - SECRET_KEY=replace_with_a_secure_random_key_for_production_32chars
      - DATABASE_URL=sqlite:///./govguide.db
      - LLM_PROVIDER=mock
      - EMAIL_ENABLED=false
      - CORS_ORIGINS=["http://localhost:8000","http://127.0.0.1:8000"]
    volumes:
      - govguide_data:/app/backend/uploads
      - govguide_db:/app/backend

volumes:
  govguide_data:
  govguide_db:
