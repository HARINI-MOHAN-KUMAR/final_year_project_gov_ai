services:
  - type: web
    name: govguide-ai
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: GovGuide AI
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: EMAIL_ENABLED
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./govguide.db
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: CORS_ORIGINS
        value: '["https://govguide-ai.onrender.com","http://localhost:5173","http://localhost:3000"]'
      - key: FRONTEND_URL
        value: https://govguide-ai.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
